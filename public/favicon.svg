<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tulaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F5FA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1F497D" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Badge Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#tulaBg)" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)" />

  <!-- TULA METROLOGY BALANCE SCALE -->
  <g transform="translate(0, 8)">
    <!-- Central Pillar -->
    <path d="M 256 160 L 256 360" stroke="#1F497D" stroke-width="18" stroke-linecap="round" />
    <!-- Base Plate -->
    <path d="M 200 360 L 312 360" stroke="#1F497D" stroke-width="20" stroke-linecap="round" />

    <!-- Main Horizontal Balance Beam -->
    <path d="M 120 160 L 392 160" stroke="#1F497D" stroke-width="18" stroke-linecap="round" />

    <!-- Top Pivot Green Verification Badge -->
    <circle cx="256" cy="130" r="28" fill="#1B7F5A" />
    <!-- White Checkmark -->
    <path d="M 244 130 L 252 138 L 268 122" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- LEFT PAN: PHYSICAL WEIGHT -->
    <!-- Suspension cords -->
    <path d="M 140 168 L 110 240 M 172 168 L 202 240" stroke="#1F497D" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 96 240 L 216 240" stroke="#1F497D" stroke-width="8" stroke-linecap="round" />
    <!-- Physical Weight (Solid Triangle) -->
    <path d="M 156 195 L 116 238 L 196 238 Z" fill="#0070C0" stroke="#0070C0" stroke-width="4" stroke-linejoin="round" />

    <!-- RIGHT PAN: DIGITAL QR VERIFICATION -->
    <!-- Suspension cords -->
    <path d="M 340 168 L 310 240 M 372 168 L 402 240" stroke="#1F497D" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 296 240 L 416 240" stroke="#1F497D" stroke-width="8" stroke-linecap="round" />
    <!-- QR Code Pattern Block -->
    <g transform="translate(320, 182)">
      <!-- Outer QR corners -->
      <rect x="0" y="0" width="18" height="18" fill="#1F497D" rx="3" />
      <rect x="4" y="4" width="10" height="10" fill="#FFFFFF" rx="1" />
      <rect x="7" y="7" width="4" height="4" fill="#0070C0" />

      <rect x="54" y="0" width="18" height="18" fill="#1F497D" rx="3" />
      <rect x="58" y="4" width="10" height="10" fill="#FFFFFF" rx="1" />
      <rect x="61" y="7" width="4" height="4" fill="#0070C0" />

      <rect x="0" y="36" width="18" height="18" fill="#1F497D" rx="3" />
      <rect x="4" y="40" width="10" height="10" fill="#FFFFFF" rx="1" />
      <rect x="7" y="43" width="4" height="4" fill="#0070C0" />

      <!-- Data bits -->
      <rect x="28" y="4" width="16" height="10" fill="#0070C0" rx="2" />
      <rect x="28" y="22" width="16" height="16" fill="#1F497D" rx="2" />
      <rect x="54" y="26" width="18" height="10" fill="#0070C0" rx="2" />
      <rect x="28" y="44" width="10" height="10" fill="#1F497D" rx="2" />
      <rect x="44" y="42" width="28" height="12" fill="#0070C0" rx="2" />
    </g>
  </g>

  <!-- Wordmark at bottom -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#1F497D" text-anchor="middle" letter-spacing="6">TULA</text>
</svg>